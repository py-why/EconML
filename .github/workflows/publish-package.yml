name: Build and publish the package to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Whether to publish the package (as opposed to just building it)'
        required: false
        default: true
        type: boolean
      environment:
        description: 'Whether to publish to production PyPI or test PyPI'
        required: false
        default: prod
        type: choice
        options: [prod, test]
      ref:
        description: 'The git ref to build the package for'
        required: false
        default: ''
        type: string
      use_lkg:
          description: 'Whether to use the last known good versions of dependencies'
          required: false
          default: True
          type: boolean

  # annoyingly, there does not seem to be a way to share these input definitions between triggers
  workflow_call:
    inputs:
      publish:
        description: 'Whether to publish the package (as opposed to just building it)'
        required: false
        default: true
        type: boolean
      # choice type only supported for workflow_dispatch, not workflow_call
      environment:
        description: 'Whether to publish to production PyPI or test PyPI'
        required: false
        default: prod
        type: string
      ref:
        description: 'The git ref to build the package for'
        required: false
        default: ''
        type: string
      use_lkg:
        description: 'Whether to use the last known good versions of dependencies'
        required: false
        default: True
        type: boolean
jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Ensure latest pip and setuptools
        run: python -m pip install --upgrade pip && pip install --upgrade setuptools
      - name: Checkout lkg branch
        uses: actions/checkout@v6
        with:
          ref: lkg
          path: lkg-cache
          fetch-depth: 1
        continue-on-error: true
      - name: Build wheels
        run: pip install 'cibuildwheel < 4' && python -m cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: ${{ inputs.use_lkg && 'cp3{9,10,11,12,13,14}{,t}-*' || 'cp3*' }}
          CIBW_SKIP: "*musl* *win32 *i686"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ENVIRONMENT: UV_BUILD_CONSTRAINT="$(pwd)/.ci-build-constraints.txt"
          CIBW_ENVIRONMENT_WINDOWS: UV_BUILD_CONSTRAINT='${{ github.workspace }}\.ci-build-constraints.txt'
          CIBW_BEFORE_BUILD: >-
            python -m pip install "build>=1.2.2" tomli uv &&
            python "{project}/.github/workflows/build_constraints.py"
            --root "{project}" --cell wheels-current-${{ matrix.os }} --distribution wheel
            --wheel-context --output "{project}/.ci-build-constraints.txt"
            --record-directory "{project}/dist"
            --use-lkg ${{ inputs.use_lkg && 'true' || 'false' }}
          # Only /output is copied back from a manylinux container.
          CIBW_BEFORE_BUILD_LINUX: >-
            python -m pip install "build>=1.2.2" tomli uv &&
            python "{project}/.github/workflows/build_constraints.py"
            --root "{project}" --cell wheels-current-${{ matrix.os }} --distribution wheel
            --wheel-context --output "{project}/.ci-build-constraints.txt"
            --record-directory /output
            --use-lkg ${{ inputs.use_lkg && 'true' || 'false' }}
          CIBW_TEST_COMMAND: >-
            python -c "import numpy as np; from econml.grf import RegressionForest;
            X = np.arange(80.).reshape(40, 2);
            f = RegressionForest(n_estimators=4, subforest_size=2, min_samples_leaf=2);
            f.fit(X, X[:, 0]); f.predict(X[:1])"
      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
      - name: Upload passing wheel build constraints
        uses: actions/upload-artifact@v6
        with:
          name: requirements-wheels-${{ matrix.os }}
          path: dist/*-build-requirements.txt
          if-no-files-found: error
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Ensure latest pip and setuptools
        run: python -m pip install --upgrade "pip>=25.3" setuptools uv "build>=1.2.2" tomli
      - name: Checkout lkg branch
        # Fetch the per-cell freeze file. continue-on-error so the bootstrap case
        # (lkg branch doesn't exist yet, or this cell has no entry) falls through
        # to the floating-install branch below.
        uses: actions/checkout@v6
        with:
          ref: lkg
          path: lkg-cache
          fetch-depth: 1
        continue-on-error: true
      - name: Prepare isolated build constraints
        run: >-
          python .github/workflows/build_constraints.py
          --cell build-current-ubuntu-latest-3.12 --distribution sdist
          --output build-current-ubuntu-latest-3.12-build-requirements.txt
          --use-lkg ${{ inputs.use_lkg && 'true' || 'false' }} --export-env
      - name: Install econml[all]
        shell: bash
        run: |
          set -euo pipefail
          RECIPE="profiles/current.toml"
          FREEZE="lkg-cache/lkg-build-current-ubuntu-latest-3.12.txt"

          WANT=$(python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()[:12])" "$RECIPE")
          HAVE=$(sed -n 's/^# recipe-sha: //p' "$FREEZE" 2>/dev/null || true)

          if [ "${{ inputs.use_lkg }}" = "true" ] && [ -f "$FREEZE" ] && [ "$WANT" = "$HAVE" ]; then
            echo "build: installing from freeze $FREEZE (recipe-sha $WANT)"
            uv --config-file "$RECIPE" pip install --system -e ".[all]" -r "$FREEZE"
          else
            echo "::notice::build: resolving fresh (freeze missing, stale, or use_lkg unset)"
            uv --config-file "$RECIPE" pip install --system -e ".[all]"
          fi
      - name: Save installed packages
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()[:12])" "profiles/current.toml")
          {
            echo "# recipe-sha: $SHA"
            echo "# build-recipe-sha: $BUILD_RECIPE_SHA"
            pip freeze --exclude-editable
          } > build-current-ubuntu-latest-3.12-requirements.txt
      - name: Build sdist
        run: uv --config-file profiles/build.toml build --sdist
      - name: Upload passing dependency pair
        uses: actions/upload-artifact@v6
        with:
          name: requirements-build-current-ubuntu-latest-3.12
          path: |
            build-current-ubuntu-latest-3.12-requirements.txt
            build-current-ubuntu-latest-3.12-build-requirements.txt
          if-no-files-found: error
      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/

  merge:
    name: Merge artifacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: "Merge artifacts"
        uses: actions/upload-artifact/merge@v6
        with:
          name: dist
          pattern: dist-*
          delete-merged: true

  publish:
    name: Publish to PyPI or TestPyPI
    needs: [merge]
    permissions:
      id-token: write
    environment: ${{ inputs.environment }}
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upload wheels and sdist to package index
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.environment == 'test' && 'https://test.pypi.org/legacy/' || '' }}
