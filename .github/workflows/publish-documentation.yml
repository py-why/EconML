name: Build and publish the documentation
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Whether to publish the documentation (as opposed to just building it)'
        required: false
        default: true
        type: boolean
      environment:
        description: 'Whether to publish to production or test environment'
        required: false
        default: prod
        type: choice
        options: [prod, test]
      ref:
        description: 'The git ref to build the documentation for'
        required: false
        default: ''
        type: string
      use_lkg:
        description: 'Whether to use the last known good versions of dependencies'
        required: false
        default: True
        type: boolean
      run_doctests:
        description: 'Whether to run doctests'
        required: false
        default: True
        type: boolean
  # annoyingly, there does not seem to be a way to share these input definitions between triggers
  workflow_call:
    inputs:
      publish:
        description: 'Whether to publish the documentation (as opposed to just building it)'
        required: false
        default: true
        type: boolean
      # choice type only supported for workflow_dispatch, not workflow_call
      environment:
        description: 'Whether to publish to production or test environment'
        required: false
        default: prod
        type: string
      ref:
        description: 'The git ref to build the documentation for'
        required: false
        default: ''
        type: string
      use_lkg:
        description: 'Whether to use the last known good versions of dependencies'
        required: false
        default: True
        type: boolean
      run_doctests:
        description: 'Whether to run doctests'
        required: false
        default: True
        type: boolean

jobs:
  create_docs:
    name: Create and publish documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Ensure latest pip and setuptools
        run: python -m pip install --upgrade "pip>=25.3" setuptools uv "build>=1.2.2" tomli
      - name: Checkout lkg branch
        # Fetch the per-cell freeze file. continue-on-error so the bootstrap case
        # (lkg branch doesn't exist yet, or this cell has no entry) falls through
        # to the floating-install branch below.
        uses: actions/checkout@v6
        with:
          ref: lkg
          path: lkg-cache
          fetch-depth: 1
        continue-on-error: true
      - name: Prepare isolated build constraints
        run: >-
          python .github/workflows/build_constraints.py
          --cell docs-current-ubuntu-latest-3.12
          --output docs-current-ubuntu-latest-3.12-build-requirements.txt
          --use-lkg ${{ inputs.use_lkg && 'true' || 'false' }} --export-env
      - name: Install econml[all]
        shell: bash
        run: |
          set -euo pipefail
          # The docs job always runs the `current` profile: doctest expected
          # values are recorded against one dependency set, so varying it here
          # would just make the doctests unrunnable.
          RECIPE="profiles/current.toml"
          FREEZE="lkg-cache/lkg-docs-current-ubuntu-latest-3.12.txt"

          WANT=$(python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()[:12])" "$RECIPE")
          HAVE=$(sed -n 's/^# recipe-sha: //p' "$FREEZE" 2>/dev/null || true)

          if [ "${{ inputs.use_lkg }}" = "true" ] && [ -f "$FREEZE" ] && [ "$WANT" = "$HAVE" ]; then
            echo "docs: installing from freeze $FREEZE (recipe-sha $WANT)"
            uv --config-file "$RECIPE" pip install --system -e ".[all]" -r "$FREEZE"
          else
            echo "::notice::docs: resolving fresh (freeze missing, stale, or use_lkg unset)"
            uv --config-file "$RECIPE" pip install --system -e ".[all]"
          fi
      - name: Save installed packages
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest()[:12])" "profiles/current.toml")
          {
            echo "# recipe-sha: $SHA"
            echo "# build-recipe-sha: $BUILD_RECIPE_SHA"
            pip freeze --exclude-editable
          } > docs-current-ubuntu-latest-3.12-requirements.txt
      - name: Install graphviz
        run: sudo apt-get -yq install graphviz
      - name: Build documentation
        run: pip install "sphinx~=7.0" "sphinx_rtd_theme~=2.0.0" scipy-doctest && sphinx-build ./doc/ ./build/sphinx/html/ -W
      - name: Upload docs as artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs
          path: build/sphinx/html/
      - name: Run doctests
        run: sphinx-build ./doc/ ./build/sphinx/doctest/ -b doctest
        if : ${{ inputs.run_doctests }}
      - name: Upload passing dependency pair
        uses: actions/upload-artifact@v6
        with:
          name: requirements-docs-current-ubuntu-latest-3.12
          path: |
            docs-current-ubuntu-latest-3.12-requirements.txt
            docs-current-ubuntu-latest-3.12-build-requirements.txt
          if-no-files-found: error
        
  publish-docs:
    name: Publish documentation
    needs: create_docs
    permissions:
      id-token: write # needed to publish to Azure
    environment: ${{ inputs.environment }}
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: html
      - name: Zip docs for publishing
        run: |-
          pushd html
          zip -r docs.zip *
          popd
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy documentation to Azure web app
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ inputs.environment == 'prod' && 'econml' || 'econml-dev' }}
          package: html/docs.zip
