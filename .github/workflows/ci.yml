name: Run all checks

# A note on job/step `if:` conditions involving success()/failure()/cancelled()/always():
#
# Most jobs/steps below need no explicit `if:` at all — the implicit default (run only if
# everything required so far succeeded) is exactly what you want unless you have a specific
# reason to keep going after a failure or skip. The pattern below covers the recurring case
# where that default isn't enough. Prefer it verbatim over inventing a new combination of
# success()/failure()/cancelled(), since those functions are easy to get subtly wrong — and,
# as explained below, even the "obviously correct" uses of `needs.*.result` have a sharp edge
# at the job level that isn't obvious from the docs.
#
# "Keep going even if a dependency failed or was skipped, as long as something actually ran":
#   job-level:  if: always()
#   step-level: if: ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
# Put `if: always()` on the job itself, and put the needs-check on EVERY step that should
# actually be skipped when the dependency chain was skipped. Unlike normal in-job failure
# propagation, a *skipped* step is not a failure, so the implicit success() default on a later
# step does NOT skip it just because an earlier step in the same job was skipped by its own
# explicit `if:` — you'd otherwise get later steps (e.g. "Setup Python", "Upload results")
# running pointlessly, and often failing in confusing ways, after the step that should have
# gated the whole job was itself quietly skipped. So this pattern only works if every step that
# depends on the needs-check carries it.
# To avoid repeating (and risking a mismatched copy of) that same condition on every step of a
# multi-step job, anchor it once on the first step and reference it with an alias on the rest,
# e.g.:
#   - name: Checkout repository
#     if: &my-job-needs-check ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
#     ...
#   - name: Some later step
#     if: *my-job-needs-check
#     ...
# This is plain YAML anchor/alias syntax, resolved by the YAML parser before the workflow file
# ever reaches GitHub's own expression engine — it's a different layer from (and unaffected by)
# the job-level `if:` quirk described below, so it doesn't inherit that risk. Give each job's
# anchor a job-specific name (YAML anchors are document-global) to avoid confusing a reader who
# jumps to the wrong job. See `coverage-report` and `generate-lkg` below for worked examples.
# This is the same overall shape already used by the `verify` job near the end of this file
# (job-level `always()` + step-level checks against `needs.*.result`, though there each step's
# condition differs so there's nothing to share via an anchor) — copy that job if you need a
# final pass/fail gate instead of a "keep going" gate.
#
# Why isn't the needs-check just part of the job's own `if:`? That's what we tried first, and it
# is an *existence* check, not a "did everything succeed" check: in theory it's true as soon as
# at least one direct `needs` entry actually ran (succeeded or failed), even if every other
# direct dependency was skipped, and false only when every direct dependency was itself skipped.
# In practice, we found GitHub Actions evaluates this unreliably when used as a *job-level* `if:`
# specifically in the "single direct dependency, and that dependency was skipped" case: a job
# whose only `needs` entry was cleanly skipped by its own `if:` condition still ran anyway when
# the check lived in the job's own `if:`, even though the exact same expression correctly skipped
# when moved to a step-level `if:` in an otherwise-unconditional (`always()`) job — reproduced
# twice in https://github.com/py-why/EconML/actions/runs/37643628893 (see the `merge-lkg` job
# there vs. the step-level version a run earlier). We don't have a public upstream GitHub issue
# number for this, so treat it as an open platform quirk rather than documented behavior. The
# practical takeaway: never put a `needs.*.result` check directly in a *job's* own `if:` — always
# push it down to a step's `if:`, with the job itself left unconditional (`always()`) or gated
# only by checks that don't depend on `needs` (e.g. generate-lkg's event-type filter below).
#
# This also explains why the naive `success() || failure()` is a trap even before you get to the
# above: those two functions walk the *entire transitive ancestor graph* of the job, not just its
# direct `needs` — so a failure several jobs further upstream can leak through a `needs` job that
# was itself cleanly *skipped* (this broke `merge-lkg` on PRs, see
# https://github.com/py-why/EconML/actions/runs/36911879734), while an upstream job that's
# skipped can also suppress a run even when a sibling dependency legitimately succeeded or failed
# (this silently dropped coverage-report results for notebook-only PRs). `needs.*.result` only
# looks at this job's own direct dependencies, so (once pushed down to step level, per above) it
# isn't subject to either surprise.
#
# The same "run regardless of outcome, but only if the thing being checked actually happened"
# idea also comes up *within* a single job, to decide whether a cleanup step should run after an
# earlier step (e.g. uploading test/coverage output after `run_tests`):
#   if: ${{ always() && contains(fromJSON('["success", "failure"]'), steps.<id>.outcome) }}
# `always()` is required to override the implicit success() default (otherwise the step would
# be skipped whenever the previous one failed); the explicit outcome check then excludes the
# case where the previous step never ran at all (e.g. an earlier install step failed first),
# which would otherwise make the cleanup step fail trying to operate on files that don't exist.
# Avoid the equivalent-but-harder-to-read `success() || failure() && contains(...)` — it relies
# on `&&` binding tighter than `||`, which is easy to misread. Unlike the job-level case above,
# this step-level pattern is scoped to steps *within the same job*, which GitHub evaluates
# sequentially and locally — we didn't observe any equivalent unreliability here.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'The git ref to build the package for'
        required: false
        default: ''
        type: string
      use_lkg:
        description: 'Whether to use the last known good versions of dependencies'
        required: false
        default: True
        type: boolean
  # nightly
  schedule:
    - cron: '0 0 * * *'

# Only run once per PR, canceling any previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Precompute the ref if the workflow was triggered by a workflow dispatch rather than copying this logic repeatedly
env:
  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || null }}
  # we want to use the LKG if that is explicitly requested, or if we're in a PR, but not a nightly run
  # the final `|| ''` is because env vars are always converted to strings and the string 'false' is truthy (!!)
  # (see https://github.com/orgs/community/discussions/25645)
  use_lkg: ${{ (github.event_name == 'workflow_dispatch' && inputs.use_lkg) || github.event_name == 'pull_request' || ''}}

jobs:
  # See the status-check-function note at the top of this file for the job-level and
  # step-level `if:` patterns used by several jobs/steps below (coverage-report,
  # merge-artifacts, generate-lkg, merge-lkg, and the test/notebook upload steps).
  eval: 
    name: Evaluate changes
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ env.ref }}
        fetch-depth: 2

      # We want to enforce the following rules for PRs:
      # * if all modifications are to README.md
      #     no testing is needed
      # * if there are modifications to docs/* or to any code
      #     then docs need to be built to verify consistency
      # * if there are modifications to notebooks/* or to any code
      #     then notebooks need to be run to verify consistency
      # * for any code changes (or changes to metadata files)
      #     linting and testing should be run
      # For a PR build, HEAD will be the merge commit, and we want to diff against the base branch,
      #  which will be the first parent: HEAD^ 
      # (For non-PR changes, we will always perform all CI tasks)
      # Note that GitHub Actions provides path filters, but they operate at the workflow level, not the job level
    - name: Determine type of code change
      run: |
        if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
          $editedFiles = git diff HEAD^ --name-only
          $editedFiles # echo edited files to enable easier debugging
          $codeChanges = $false
          $docChanges = $false
          $nbChanges = $false
          $changeType = "none"
          foreach ($file in $editedFiles) {
            switch -Wildcard ($file) {
              "README.md" { Continue }
              ".gitignore" { Continue }
              "econml/_version.py" { Continue }
              "prototypes/*" { Continue }
              "images/*" { Continue }
              "doc/*" { $docChanges = $true; Continue }
              "notebooks/*" { $nbChanges = $true; Continue }
              default { $codeChanges = $true; Continue }
            }
          }
        }
        echo "buildDocs=$(($env:GITHUB_EVENT_NAME -ne 'pull_request') -or ($docChanges -or $codeChanges))" >> $env:GITHUB_OUTPUT
        echo "buildNbs=$(($env:GITHUB_EVENT_NAME -ne 'pull_request') -or ($nbChanges -or $codeChanges))" >> $env:GITHUB_OUTPUT
        echo "testCode=$(($env:GITHUB_EVENT_NAME -ne 'pull_request') -or $codeChanges)" >> $env:GITHUB_OUTPUT
      shell: pwsh
      id: eval
    outputs: 
      buildDocs: ${{ steps.eval.outputs.buildDocs }}
      buildNbs: ${{ steps.eval.outputs.buildNbs }}
      testCode: ${{ steps.eval.outputs.testCode }}

  lint:
    name: Lint code
    needs: [eval]
    if: ${{ needs.eval.outputs.testCode == 'True' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ env.ref }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
    - name: Ensure latest pip and setuptools
      run: python -m pip install --upgrade pip && pip install --upgrade setuptools
    - name: Run Ruff
      run: 'pip install ruff && ruff check'

  notebooks:
    name: Run notebooks
    needs: [eval]
    if: ${{ needs.eval.outputs.buildNbs == 'True' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kind: [except-customer-scenarios, customer-scenarios]
        include:
        - kind: "except-customer-scenarios"
          extras: "[plt,ray]"
          pattern: "(?!CustomerScenarios)"
          install_graphviz: true
          version: '3.12'
        - kind: "customer-scenarios"
          extras: "[plt,dowhy]"
          pattern: "CustomerScenarios"
          version: '3.12'
          install_graphviz: false
      fail-fast: false
    env:
      id_string: ${{ matrix.kind }}-${{ matrix.version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ env.ref }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.version }}
    - name: Install uv
      # check if we're running on windows
      run: ${{ runner.os == 'Windows' && 'irm https://astral.sh/uv/install.ps1 | iex' || 'curl -LsSf https://astral.sh/uv/install.sh | sh' }}
    - name: Install graphviz
      run: sudo apt-get -yq install graphviz
      if: ${{ matrix.install_graphviz }}
    # Add verbose flag to pip installation if in debug mode
    - name: Install econml
      run: uv pip install --system -e .${{ matrix.extras }} ${{ fromJSON('["","-v"]')[runner.debug] }} ${{ env.use_lkg && '-r lkg-notebook.txt' }}
    # Install notebook requirements (if not already done as part of lkg)
    - name: Install notebook requirements
      run: uv pip install --system jupyter jupyter-client nbconvert nbformat seaborn xgboost tqdm
      if: ${{ !env.use_lkg }}
    - name: Save installed packages
      run: pip freeze --exclude-editable > notebooks-${{ env.id_string }}-requirements.txt
    - name: Upload installed packages
      uses: actions/upload-artifact@v6
      with:
        name: requirements-${{ env.id_string }}
        path: notebooks-${{ env.id_string }}-requirements.txt
    - name: Install pytest
      run: uv pip install --system pytest pytest-xdist pytest-cov coverage[toml]
    - name: Run notebook tests
      run: python -m pytest
      id: run_tests
      env:
        PYTEST_ADDOPTS: '-m "notebook"'
        NOTEBOOK_DIR_PATTERN: ${{ matrix.pattern }}
        COVERAGE_PROCESS_START: 'pyproject.toml'
    # Steps below run whether `run_tests` succeeded or failed, but only if it actually ran
    # (as opposed to being skipped because an earlier step, e.g. installing dependencies,
    # failed first). `always()` overrides the implicit `success()` default so the step isn't
    # skipped just because `run_tests` failed; the explicit outcome check then filters out
    # the case where `run_tests` itself never ran.
    - name: Make coverage filename unique
      run: mv .coverage .coverage.${{ env.id_string }}
      if: always() && contains(fromJSON('["success", "failure"]'), steps.run_tests.outcome)
    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      if: always() && contains(fromJSON('["success", "failure"]'), steps.run_tests.outcome)
      with:
        name: coverage-${{ env.id_string }}
        path: .coverage.${{ env.id_string }}
        # need to include hidden files since path starts with .
        include-hidden-files: true
    - name: Make test XML filename unique
      run: mv junit/test-results.xml ${{ env.id_string }}-test-results.xml
      if: always() && contains(fromJSON('["success", "failure"]'), steps.run_tests.outcome)
    - name: Upload test XML files
      uses: actions/upload-artifact@v6
      if: always() && contains(fromJSON('["success", "failure"]'), steps.run_tests.outcome)
      with:
        name: tests-${{ env.id_string }}
        path: ${{ env.id_string }}-test-results.xml
    - name: Upload notebook outputs
      uses: actions/upload-artifact@v6
      if: always() && contains(fromJSON('["success", "failure"]'), steps.run_tests.outcome)
      with:
        name: notebooks-${{ env.id_string }}
        path: notebooks/output/
  
  tests:
    name: "Run tests"
    needs: [eval]
    if: ${{ needs.eval.outputs.testCode == 'True' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        kind: [serial, other, dml, main, treatment, ray]
        exclude:
          # Serial tests fail randomly on mac sometimes, so we don't run them there
          - os: macos-latest
            kind: serial
          # Ray tests run out of memory on Windows
          - os: windows-latest
            kind: ray
          # Ray doesn't currently support Python 3.14
          - python-version: '3.14'
            kind: ray
        # Assign the correct package and testing options for each kind of test
        include:
          - kind: serial
            opts: '-m "serial and not ray" -n 1'
            extras: ""
          - kind: other
            opts: '-m "cate_api and not ray" -n auto'
            extras: "[plt]"
          - kind: dml
            opts: '-m "dml and not ray"'
            extras: "[plt]"
          - kind: main
            opts: '-m "not (notebook or automl or dml or serial or cate_api or treatment_featurization or ray)" -n 2'
            extras: "[plt,dowhy]"
          - kind: treatment
            opts: '-m "treatment_featurization and not ray" -n auto'
            extras: "[plt]"
          - kind: ray
            opts: '-m "ray"'
            extras: "[ray]"
      fail-fast: false    
    runs-on: ${{ matrix.os }}
    env:
      id_string: ${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.kind }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ env.ref }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install libomp
      # lightgbm needs libomp on mac
      run: brew install libomp
      if: matrix.os == 'macos-latest'
    - name: Install graphviz on Ubuntu
      run: sudo apt-get -yq install graphviz
      if: ${{ matrix.os == 'ubuntu-latest' }}
    - name: Install uv
      # check if we're running on windows
      run: ${{ runner.os == 'Windows' && 'irm https://astral.sh/uv/install.ps1 | iex' || 'curl -LsSf https://astral.sh/uv/install.sh | sh' }}
    # Add verbose flag to pip installation if in debug mode
    - name: Install econml
      run: uv pip install --system -e .${{ matrix.extras }} ${{ fromJSON('["","-v"]')[runner.debug] }} ${{ env.use_lkg && '-r lkg.txt' }}
    - name: Save installed packages
      run: pip freeze --exclude-editable > tests-${{ env.id_string }}-requirements.txt
    - name: Upload installed packages
      uses: actions/upload-artifact@v6
      with:
        name: requirements-${{ env.id_string }}
        path: tests-${{ env.id_string }}-requirements.txt
    - name: Install pytest
      run: uv pip install --system pytest pytest-xdist pytest-cov coverage[toml]
    - name: Run tests
      run: python -m pytest
      id: run_tests
      env:
        PYTEST_ADDOPTS: ${{ matrix.opts }}
        COVERAGE_PROCESS_START: 'pyproject.toml'
        # Force matplotlib's non-interactive backend to avoid the intermittent
        # `_tkinter.TclError: Can't find a usable init.tcl` failure that the
        # hosted Windows runners hit when matplotlib auto-selects TkAgg.
        # See https://github.com/actions/setup-python/issues/1102. Setting this
        # unconditionally (not just on Windows) keeps behavior consistent
        # across the matrix and matches what other projects affected by the
        # same flake have done.
        MPLBACKEND: Agg
    # Steps below run whether `run_tests` succeeded or failed, but only if it actually ran
    # (see the identical comment in the `notebooks` job above for the full rationale).
    - name: Make coverage filename unique
      run: mv .coverage .coverage.${{ env.id_string }}
      if: always() && contains(fromJSON('["success", "failure"]'), steps.run_tests.outcome)
    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      if: always() && contains(fromJSON('["success", "failure"]'), steps.run_tests.outcome)
      with:
        name: coverage-${{ env.id_string }}
        path: .coverage.${{ env.id_string }}
        # need to include hidden files since path starts with .
        include-hidden-files: true
    - name: Make test XML filename unique
      run: mv junit/test-results.xml ${{ env.id_string }}-test-results.xml
      if: always() && contains(fromJSON('["success", "failure"]'), steps.run_tests.outcome)
    - name: Upload test XML files
      uses: actions/upload-artifact@v6
      if: always() && contains(fromJSON('["success", "failure"]'), steps.run_tests.outcome)
      with:
        name: tests-${{ env.id_string }}
        path: ${{ env.id_string }}-test-results.xml

  store-reqs-per-env:
    name: Store requirements for LKG updates
    # No `needs:`, so there are no ancestor jobs for a `success()`/`failure()` check to mean
    # anything: this job's own condition is just the event-type gate below.
    if: github.event_name == 'workflow_dispatch' && !inputs.use_lkg || github.event_name == 'schedule'
    strategy:
      matrix:
        kind: [tests]
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # assign extras to all combinations
          - extras: "[plt,dowhy,ray]"
          # overwrite extras for python 3.14, and 3.13 under Windows, because ray is unsupported there
          - extras: "[plt,dowhy]"
            python-version: '3.14'
          - extras: "[plt,dowhy]"
            python-version: '3.13'
            os: 'windows-latest'
            # explicitly add the two notebook extras
          - kind: notebooks-other
            os: ubuntu-latest
            python-version: '3.12'
            extras: "[plt,ray]"
          - kind: notebooks-customer
            os: ubuntu-latest
            python-version: '3.12'
            extras: "[plt,dowhy]"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ env.ref }}
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      # check if we're running on windows
      run: ${{ runner.os == 'Windows' && 'irm https://astral.sh/uv/install.ps1 | iex' || 'curl -LsSf https://astral.sh/uv/install.sh | sh' }}
    - name: Install econml
      # add all extras used by any of the individual tests, which is a superset of what's actually used anywhere
      run: uv pip install --system -e .${{ matrix.extras }}
    - name: Install notebook requirements
      run: uv pip install --system jupyter jupyter-client nbconvert nbformat seaborn xgboost tqdm
      if: startswith(matrix.kind, 'notebooks-')
    - name: Save installed packages
      run: pip freeze --exclude-editable > lkg-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.python-version }}.txt
    - name: Upload installed packages
      uses: actions/upload-artifact@v6
      with:
        name: lkg-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.python-version }}
        path: lkg-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.python-version }}.txt

  coverage-report:
    name: "Coverage report"
    needs: [tests, notebooks]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      if: &coverage-report-needs-check ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
      uses: actions/checkout@v6
      with:
        ref: ${{ env.ref }}
    - name: Get coverage reports
      if: *coverage-report-needs-check
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        path: coverage
        merge-multiple: true
    - name: Setup Python
      if: *coverage-report-needs-check
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install coverage
      if: *coverage-report-needs-check
      run: pip install coverage[toml]
    - name: Combine coverage reports
      if: *coverage-report-needs-check
      run: coverage combine coverage/
    - name: Generate coverage report
      if: *coverage-report-needs-check
      run: coverage report -m --format=markdown > $GITHUB_STEP_SUMMARY
    - name: Generate coverage html --fail-under=86
      if: *coverage-report-needs-check
      run: coverage html
    - name: Upload coverage report
      if: *coverage-report-needs-check
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: htmlcov
      
  merge-artifacts:
    name: "Merge artifacts"
    needs: [coverage-report, tests, notebooks, store-reqs-per-env]
    if: always()
    strategy:
      matrix:
        artifact: [requirements, tests, coverage, notebooks, lkg-tests, lkg-notebooks]
    runs-on: ubuntu-latest
    steps:
    - name: "Merge artifacts"
      if: ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
      uses: actions/upload-artifact/merge@v6
      with:
        name: ${{ matrix.artifact }}
        pattern: "${{ matrix.artifact }}-*"
        delete-merged: true
      # if we are re-running a job in a subsequent attempt, some of the other artifacts may not exist in this attempt (e.g. notebooks, if only non-notebook tests failed)
      # Unlike with plain upload-artifact, there's no way to ignore the situation where no files are found when using the v4 merge action
      # (see https://github.com/actions/upload-artifact/issues/520), so just continue on error isntead
      continue-on-error: true

  generate-lkg:
    name: "Generate updated last known good files"
    needs: [merge-artifacts]
    # The event-type gate below is a deterministic, needs-independent check, so it's safe to keep
    # at job level; only the needs.*.result check moves to the first step (see top-of-file doc).
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.use_lkg || github.event_name == 'schedule' }}
    strategy:
      matrix:
        kind: [tests, notebooks]
        include:
        - kind: tests
          pattern: tests
          output-name: lkg
        - kind: notebooks
          pattern: "notebooks-(?P<subset>[a-z]+)"
          output-name: lkg-notebook
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      if: &generate-lkg-needs-check ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
      uses: actions/checkout@v6
      with:
        ref: ${{ env.ref }}
    - name: Setup Python
      if: *generate-lkg-needs-check
      uses: actions/setup-python@v6
    - name: Download files
      if: *generate-lkg-needs-check
      uses: actions/download-artifact@v8
      with:
        name: lkg-${{ matrix.kind }}
        path: requirements
    - name: "Generate last known good versions"
      if: *generate-lkg-needs-check
      run: python .github/workflows/generate_lkg.py requirements "lkg-${{ matrix.pattern }}-(?P<os>[a-z]+)-(latest|[0-9.]+)-(?P<pyversion>[0-9.]+).txt" ${{ matrix.output-name }}.txt
    - name: "Upload last known good versions"
      if: *generate-lkg-needs-check
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.output-name }}
        path: ${{ matrix.output-name }}.txt
        
  merge-lkg:
    name: "Merge last known good versions"
    needs: [generate-lkg]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: "Merge last known good versions"
      if: ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
      uses: actions/upload-artifact/merge@v6
      with:
        # can't use just "lkg" for the name since that artifact already exists and merge won't overwrite it even when delete-merged is true
        name: lkg-files
        pattern: "lkg*"
        delete-merged: true

  build:
    name: Build package
    needs: [eval]
    if: ${{ needs.eval.outputs.testCode == 'True' }}
    uses: ./.github/workflows/publish-package.yml
    with:
      publish: false
      environment: test
      # don't have access to env context here for some reason
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || null }}
      # can't use env context here so need to duplicate expression, but these are true boolean values so don't need extra string logic
      use_lkg: ${{ (github.event_name == 'workflow_dispatch' && inputs.use_lkg) || github.event_name == 'pull_request' }}

  docs:
    name: Build documentation
    needs: [eval]
    if: ${{ needs.eval.outputs.buildDocs == 'True' }}
    uses: ./.github/workflows/publish-documentation.yml
    with:
      publish: false
      environment: test
      # don't have access to env context here for some reason
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || null }}
      # can't use env context here so need to duplicate expression, but these are true boolean values so don't need extra string logic
      use_lkg: ${{ (github.event_name == 'workflow_dispatch' && inputs.use_lkg) || github.event_name == 'pull_request' }}
      
  verify:
    name: Verify CI checks
    needs: [lint, notebooks, tests, build, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: At least one check failed or was cancelled
      run: exit 1
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    - name: All checks passed
      run: exit 0
      if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
